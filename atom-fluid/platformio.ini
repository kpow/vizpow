; Atom Matrix — FLIP Fluid (5x5 port of fluid-pendant)
; M5 Atom Matrix: ESP32-PICO-D4, 5x5 WS2812 on GPIO27, Bosch BMI270 IMU.

[platformio]
default_envs = atom-matrix

[env:atom-matrix]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board     = m5stack-atom            ; ESP32-PICO-D4, 4MB flash, no PSRAM
framework = arduino
monitor_speed = 115200

; Solver headers live in include/.
build_flags =
	-Iinclude
	-O3
	-ffast-math
	-funroll-loops
	-fomit-frame-pointer
	-DCORE_DEBUG_LEVEL=0
	; No ARDUINO_USB_CDC_ON_BOOT: Atom uses an external USB-serial chip.

lib_deps =
	fastled/FastLED@3.10.3
	m5stack/M5Unified@0.2.13
