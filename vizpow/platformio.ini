[platformio]
default_envs = target-led
src_dir = .

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
monitor_speed = 115200
extra_scripts = name_firmware.py
lib_deps =
    fastled/FastLED@3.10.3
    lewisxhe/SensorLib@0.4.0

[env:target-led]
board = esp32-s3-devkitc-1
build_flags =
    -DBOARD_ESP32S3_MATRIX
    -DARDUINO_USB_CDC_ON_BOOT=1
# Waveshare ESP32-S3-Matrix has a 4MB flash chip. Without these, the board
# default generates an 8MB-style partition table whose last partition runs
# past 0x400000, so the bootloader rejects it ("partition ... exceeds flash
# chip size") and boot-loops. Pin the build to 4MB + a 4MB-safe table.
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB

[env:target-lcd]
board = esp32-s3-devkitc-1
build_flags =
    -DBOARD_ESP32S3_LCD_169
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.2.19
    moononournation/GFX Library for Arduino@1.6.5
