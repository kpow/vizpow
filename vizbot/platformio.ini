; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lcd-169
src_dir = .

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board_build.filesystem = LittleFS
monitor_speed = 115200
extra_scripts = name_firmware.py
lib_deps = 
	fastled/FastLED@3.10.3
	lewisxhe/SensorLib@0.4.0
	bblanchon/ArduinoJson@7.4.3

[env:lcd-169]
board = esp32-s3-devkitc-1
build_flags = 
	-DBOARD_ESP32S3_LCD_169
	-DBOARD_HAS_RING_LEDS
	; The devkitc-1 board definition is the no-PSRAM N8, so it never sets this.
	; Without it the Arduino core stubs psramFound() to false even though IDF
	; has the 8MB OPI PSRAM up and in the heap.
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	; Kaleido HD background (kaleido_scene.h, ko_*.c). 1.69 only: it is made for
	; the pendant. Holds no memory and runs no task until someone picks it.
	-DKALEIDO_ENABLED
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
lib_deps = 
	${env.lib_deps}
	lovyan03/LovyanGFX@1.2.19

[env:lcd-169-dev]
; Bench build, never for release: lcd-169 plus Kaleido keys and stats over USB
; serial (kaleidoDevSerial). Its file name lacks the board type, so the web
; panel's firmware upload refuses it.
extends = env:lcd-169
build_flags =
	${env:lcd-169.build_flags}
	-DKALEIDO_SERIAL_STATS

[env:lcd-13]
board = esp32-s3-devkitc-1
build_flags = 
	-DBOARD_ESP32S3_LCD_13
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
lib_deps = 
	${env.lib_deps}
	lovyan03/LovyanGFX@1.2.19

[env:m5cores3]
board = m5stack-cores3
build_flags =
	-DBOARD_M5CORES3
	-DARDUINO_USB_CDC_ON_BOOT=1
; Some CoreS3 flash chips are unreliable in QIO mode (bootloader hangs -> TG0WDT
; reset loop, black screen). DIO works on every flash chip; negligible speed cost.
board_build.flash_mode = dio
board_upload.flash_size = 16MB
lib_deps = 
	${env.lib_deps}
	m5stack/M5Unified@0.2.13
	; No explicit M5GFX pin, unlike the older envs: 0.2.19 has been pulled from
	; the registry, and M5Unified resolves a compatible version itself.
	https://github.com/m5stack/M5-SAM2695.git#4f4b788efd6cee4b9dc7127b0ea55976c168011e
	kosme/arduinoFFT@2.0.4

[env:stackchan]
board = m5stack-cores3
build_flags =
	-DBOARD_M5CORES3
	-DBOARD_HAS_STACKCHAN_BASE
	-DARDUINO_USB_CDC_ON_BOOT=1
; Same CoreS3 QIO flash unreliability as [env:m5cores3] -- force DIO.
board_build.flash_mode = dio
board_upload.flash_size = 16MB
; M5Unified 0.2.29 / M5GFX 0.2.36, newer than the other CoreS3 envs: 0.2.13
; never let the AXP2101 charge the base battery (TS pin inhibit, unset charge
; voltage), left its DCDC under-voltage power-off armed, and switched the 5V bus
; on with no precharge. The servo rail boosts straight off that battery, so the
; cell ran flat even on USB and the bot crash-looped.
lib_deps =
	${env.lib_deps}
	m5stack/M5Unified@0.2.29
	https://github.com/m5stack/M5-SAM2695.git#4f4b788efd6cee4b9dc7127b0ea55976c168011e
	m5stack/M5GFX@0.2.36
	kosme/arduinoFFT@2.0.4
; M5's official StackChan BSP. Owns the servo bus (Motion drives it from a
; single task behind a blocking mutex) plus the PY32 expander, Si12T head touch
; and INA226. Replaces the hand-rolled copies that used to live in
; vizbot/drivers/ — see stackchan_base.h for why.
	https://github.com/m5stack/StackChan-BSP.git#8d4d6fc3b7a6be379c6317c45a02a30bff8c492e

[env:stackchan-ramtrace]
; Bench only: stackchan plus the internal-RAM allocation tracer (ram_trace.cpp,
; GET /debug/ramtrace). The allocator is wrapped at link time.
extends = env:stackchan
build_flags =
	${env:stackchan.build_flags}
	-DVIZ_RAM_TRACE
	-Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=heap_caps_malloc,--wrap=heap_caps_calloc,--wrap=heap_caps_realloc,--wrap=heap_caps_aligned_alloc,--wrap=heap_caps_aligned_calloc

[env:faces]
; ---------------------------------------------------------------------------
; vizBot on a CoreS3 in an M5Stack Faces Bottom3 (the game base). This device
; also carries the kFun game console and a top-level chooser, so vizBot lives in
; ota_1 of the shared partition table and the chooser hands control to it.
;
; The base shares only its addressable strip with a stack-chan base, so this
; uses BOARD_HAS_FACES_BASE (LED engine + faces_base.h backend) instead of
; BOARD_HAS_STACKCHAN_BASE, which assumes servos, an IO expander, head touch and
; a power monitor and blocks for ~4.6s every five minutes looking for them.
;
; !! partitions_kfun.csv must stay byte-identical to the copy in
; ~/projects/tinyfun — every upload rewrites the table at 0x8000, so if they
; drift, whichever project you flashed last redefines the layout for all three.
;
; !! custom_app_offset is load-bearing: PlatformIO targets ota_0 whenever a
; table has one, so without it this would upload straight over the games.
; ---------------------------------------------------------------------------
board = m5stack-cores3
build_flags =
	-DBOARD_M5CORES3
	-DBOARD_HAS_FACES_BASE
	-DARDUINO_USB_CDC_ON_BOOT=1
; Same CoreS3 QIO flash unreliability as [env:m5cores3] -- force DIO.
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = partitions_kfun.csv
extra_scripts =
	${env.extra_scripts}
	post:app_offset.py
custom_app_offset = 0x510000
lib_deps =
	${env.lib_deps}
	m5stack/M5Unified@0.2.13
	; No explicit M5GFX pin, unlike the older envs: 0.2.19 has been pulled from
	; the registry, and M5Unified resolves a compatible version itself.
	https://github.com/m5stack/M5-SAM2695.git#4f4b788efd6cee4b9dc7127b0ea55976c168011e
	kosme/arduinoFFT@2.0.4
