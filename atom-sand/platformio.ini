; Atom Matrix — Gravity Sand Toy
; Standalone firmware for the M5 Atom Matrix (ESP32-PICO-D4, 5x5 WS2812, MPU6886).
; Deliberately independent of the vizbot tree — see ../atom-sand.ino for why.

[platformio]
default_envs = atom-matrix
src_dir = .

[env:atom-matrix]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board     = m5stack-atom          ; ESP32-PICO-D4, 4MB flash, no PSRAM
framework = arduino
monitor_speed = 115200
; No ARDUINO_USB_CDC_ON_BOOT: the Atom uses an external USB-serial chip, not
; native USB-CDC. M5Unified is used ONLY for the IMU + face button: this unit
; ships a Bosch BMI270 (chip id 0x24), which needs an ~8KB config blob uploaded
; at init — M5Unified handles that. FastLED still owns the 5x5 matrix on GPIO27
; (M5GFX has no panel driver for the WS2812 matrix, so it never touches the pin).
lib_deps  =
	fastled/FastLED@3.10.3
	m5stack/M5Unified@0.2.13
