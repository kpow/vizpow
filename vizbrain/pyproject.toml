[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vizbrain"
version = "0.1.0"
description = "The brain for vizBot: speech to text, Claude, text to speech, and lab tools"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "mlx-whisper>=0.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
vizbrain = "vizbrain.__main__:main"

[tool.setuptools.packages.find]
include = ["vizbrain*"]

[tool.setuptools.package-data]
vizbrain = ["static/*"]
