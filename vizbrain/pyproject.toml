[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vizbrain"
dynamic = ["version"]
description = "The brain for vizBot: speech to text, Claude, text to speech, and lab tools"
requires-python = ">=3.11"
# install.sh installs these at the exact versions in constraints.txt (the set
# that has actually been run); the bounds here are for installs by hand.
dependencies = [
  "anthropic>=1.11",
  "mlx-whisper>=0.4",
  "numpy>=1.26",
  "kokoro-onnx>=0.4",
  "onnxruntime>=1.20",
  "huggingface_hub>=0.20",
  "mcp>=2.0",          # connectors (MCP servers whose tools vizBot uses) and `vizbrain mcp`
  "sounddevice>=0.5",  # his voice through the Mac's speaker (settings "speaker": "mac")
]

[project.scripts]
vizbrain = "vizbrain.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "vizbrain.__version__"}

[tool.setuptools.packages.find]
include = ["vizbrain*"]

[tool.setuptools.package-data]
vizbrain = ["static/*"]
