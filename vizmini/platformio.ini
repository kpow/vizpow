; ============================================================================
; vizMini — ESP32-C3 Super Mini + 1.3" monochrome I2C OLED
; ============================================================================
; A standalone, pared-down vizbot. Reuses the vizbot face engine verbatim
; (tween.h / bot_faces.h / bot_eyes.h) with a 1-bit U8g2 rendering adapter.
;
;   pio run -e c3-oled            # build
;   pio run -e c3-oled -t upload  # flash over USB
;   pio device monitor            # serial (native USB CDC)
; ============================================================================

[platformio]
default_envs = c3-oled
src_dir = .

[env:c3-oled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_upload.flash_size = 4MB
; min_spiffs: ~1.9MB app slot (x2 for future OTA) + small LittleFS. Plenty of
; headroom over the default 1.3MB app partition.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; post-build: publish app + factory images to repo-root builds/ (versioned)
extra_scripts = name_firmware.py
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	olikraus/U8g2@^2.35.30
